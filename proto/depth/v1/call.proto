// call.proto —— 音视频通话信令（前瞻性契约，Phase 2 实现）。
//
// 采用 WebRTC 信令模型：SDP 协商 + ICE 候选交换，通过 WS 事件通道传输。
// MVP 尚未实现，先行固化字段以避免后续破坏式变更。
syntax = "proto3";

package depth.v1;

option go_package = "github.com/tss/depth/server/gen/pb;pb";

// CallState 通话状态机。
enum CallState {
  CALL_STATE_UNSPECIFIED = 0;
  CALL_STATE_INVITING = 1; // 主叫发起
  CALL_STATE_RINGING = 2; // 被叫振铃
  CALL_STATE_CONNECTING = 3; // 协商中
  CALL_STATE_CONNECTED = 4; // 已接通
  CALL_STATE_ENDED = 5; // 已结束
  CALL_STATE_REJECTED = 6; // 被拒绝
  CALL_STATE_MISSED = 7; // 未接
}

// CallInvite 邀请建立通话。
message CallInvite {
  string call_id = 1;
  string conversation_id = 2;
  string from_user_id = 3;
  repeated string to_user_ids = 4;
  bool video = 5; // false=纯音频
}

// CallSignal 携带 SDP 协商内容（offer/answer）。
message CallSignal {
  string call_id = 1;
  string from_user_id = 2;
  string sdp = 3; // SDP 文本
  string sdp_type = 4; // "offer" | "answer"
}

// IceCandidate 单条 ICE 候选。
message IceCandidate {
  string call_id = 1;
  string from_user_id = 2;
  string candidate = 3;
  string sdp_mid = 4;
  int32 sdp_mline_index = 5;
}

// CallControl 挂断/拒绝/取消等控制信令。
message CallControl {
  string call_id = 1;
  string conversation_id = 2;
  string from_user_id = 3;
  CallState state = 4;
  string reason = 5; // 结束/拒绝原因（可选）
}

// CallEvent 通话信令事件封装（同样通过 WS 通道传输）。
message CallEvent {
  oneof kind {
    CallInvite invite = 1;
    CallSignal signal = 2;
    IceCandidate candidate = 3;
    CallControl control = 4;
  }
}
