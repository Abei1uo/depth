# Buf 工作区配置（v2）。proto 源位于 depth/v1 下，作为跨端（Go / Dart）协议的唯一事实来源。
version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # MVP 阶段允许简洁的枚举命名与共享的 RPC 请求/响应类型：
    # 这些 service 仅作为跨端契约，实际传输走 JSON，不启用生成的 gRPC 桩。
    - ENUM_VALUE_PREFIX
    - ENUM_ZERO_VALUE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
